{% extends "base.html" %}
{% block content %}
<div class="w-full flex flex-row flex-wrap">
    <div class="w-full bg-indigo-100 h-screen flex flex-row flex-wrap justify-center" style="background: linear-gradient(90deg, #1a263a, #4a6a8a);">
        <!-- Navbar (Hidden on Mobile, Sidebar on Desktop) -->
        <div class="bg-white shadow-lg border-t-4 border-indigo-500 absolute bottom-0 w-full md:w-0 md:hidden flex flex-row flex-wrap">
            <div class="w-full text-right"><button class="p-2 fa fa-bars text-4xl text-gray-600"></button></div>
        </div>
        <div class="w-0 md:w-1/4 lg:w-1/5 h-0 md:h-screen overflow-y-hidden bg-gray-800 shadow-lg text-white">
            <div class="p-5 bg-gray-900 sticky top-0">
                <img class="border border-indigo-100 shadow-lg round" src="{{ url_for('static', filename='uploads/' + current_user.profile_pic) }}">
                <div class="pt-2 border-t mt-5 w-full text-center text-xl">
                    {{ current_user.username }}
                </div>
            </div>
            <div class="w-full h-screen antialiased flex flex-col hover:cursor-pointer text-gray-200">
                <a class="hover:bg-gray-700 bg-gray-800 border-t-2 p-3 w-full text-xl text-left" href="{{ url_for('feed') }}"><i class="fa fa-home text-gray-300 text-2xl pr-1 pt-1 float-right"></i>Feed</a>
                <a class="hover:bg-gray-700 bg-gray-800 border-t-2 p-3 w-full text-xl text-left" href="{{ url_for('messages', user_id=current_user.id) }}"><i class="fa fa-comment text-gray-300 text-2xl pr-1 pt-1 float-right"></i>Messages</a>
                <a class="hover:bg-gray-700 bg-gray-800 border-t-2 p-3 w-full text-xl text-left" href="{{ url_for('logout') }}"><i class="fa fa-arrow-left text-gray-300 text-2xl pr-1 pt-1 float-right"></i>Log out</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="w-full md:w-3/4 lg:w-4/5 p-5 md:px-12 lg:px-24 h-full flex items-center justify-center bg-opacity-80 bg-gray-900 text-white">
            <div class="bg-gray-800 w-full max-w-md shadow-lg rounded-lg p-8 text-center">
                <h2 class="text-3xl font-bold mb-4 text-indigo-300">🗿 Leaving ArchaeoNet?</h2>
                <p class="text-gray-300 mb-6">Are you sure you want to log out? Your archaeological journey will pause here.</p>
                <form method="POST" action="{{ url_for('logout') }}">
                    <button type="submit" class="bg-red-600 hover:bg-red-500 text-white p-3 rounded-lg font-semibold">Yes, Log Out</button>
                    <a href="{{ url_for('feed') }}" class="ml-4 bg-gray-700 hover:bg-gray-600 text-white p-3 rounded-lg font-semibold">No, Stay</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
